name: QA & Tests

on:
  workflow_call:
    inputs:
      python-versions:
        type: string
        # JSON array — our team's standard matrix. Bumping this here migrates every
        # consuming repo in sync on their next run. Callers can override with their own
        # JSON list (e.g. a 3rd-party lib supporting a different range).
        default: '["3.12", "3.13"]'
      working-directory:
        type: string
        default: "."
      services-compose:
        type: string
        default: ""
        description: >-
          Path to a docker-compose file (relative to working-directory) whose services the
          checks need — e.g. a Postgres for pytest. When set, the reusable runs
          `docker compose -f <file> up -d --wait` BEFORE setup-script/checks and
          `docker compose -f <file> down -v` AFTER, always. This is the first-class way to
          give DB-backed repos (Cloud, Blog, …) a database in CI — cleaner than hand-rolling
          it in setup-script. Requires healthchecks in the compose services for `--wait`.
      setup-script:
        type: string
        default: ""
        description: >-
          Shell run on the runner AFTER `poetry install` and AFTER services are up, BEFORE
          `poe check` (once per matrix leg). For runtime system packages (apt), Cython
          `build_ext --inplace`, DB migrations, fixture seeding, etc. Runs in working-directory.
      post-run-script:
        type: string
        default: ""
        description: >-
          Shell run AFTER `poe check`, ALWAYS (even if checks failed) — for teardown /
          cleanup. Runs before the services are torn down. Its own failure also fails the job.

jobs:
  qa:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(inputs.python-versions) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}

    steps:
      - uses: actions/checkout@v4

      - name: Install poetry
        run: pipx install poetry

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry

      - name: Install dependencies
        run: poetry install

      # Bring service containers up before anything that might need them (migrations in
      # setup-script, pytest in checks). `--wait` blocks until healthchecks pass.
      - name: Start service containers
        if: inputs.services-compose != ''
        run: docker compose -f "${{ inputs.services-compose }}" up -d --wait

      - name: Setup
        if: inputs.setup-script != ''
        run: ${{ inputs.setup-script }}

      - name: Run checks
        run: poetry run poe check --ci

      - name: Post-run
        if: always() && inputs.post-run-script != ''
        run: ${{ inputs.post-run-script }}

      # Always tear services down (and drop their volumes) so a rerun starts clean.
      - name: Stop service containers
        if: always() && inputs.services-compose != ''
        run: docker compose -f "${{ inputs.services-compose }}" down -v

  # Single, stable status for branch protection to require — one name regardless of how
  # many versions the matrix has, so the required check doesn't change when the matrix does.
  check:
    name: check
    needs: qa
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify the QA matrix passed
        run: |
          [ "${{ needs.qa.result }}" = "success" ] || { echo "QA matrix did not pass"; exit 1; }
